<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поход в Средиземье — От Хоббитона до Мордора</title>
<style>
:root{--bg-deep:#0d1117;--bg-panel:#161b22;--bg-card:#1c2128;--border:#30363d;--gold:#c9a227;--gold-bright:#e8c547;--gold-dim:#8a7020;--text:#e6edf3;--text-dim:#8b949e;--text-muted:#6e7681;--hp:#3fb950;--stamina:#58a6ff;--hunger:#d29922;--xp:#a371f7;--danger:#f85149;--good:#3fb950;--story:#e8c547;--thought:#a5d6ff;--shadow:0 8px 24px rgba(0,0,0,.4);--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg-deep);color:var(--text);min-height:100vh;line-height:1.55}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(201,162,39,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(88,166,255,.04) 0%,transparent 50%);z-index:-1;pointer-events:none}
#app{max-width:920px;margin:0 auto;padding:16px;min-height:100vh}
.screen{animation:fadeIn .45s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(201,162,39,.3)}50%{box-shadow:0 0 18px rgba(201,162,39,.55)}}
.low-hp .bar-fill.hp{animation:pulse 1.2s infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;background:var(--bg-card);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:.95em;border-radius:8px;cursor:pointer;transition:all .2s}
.btn:hover{border-color:var(--gold-dim);background:#21262d;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#3d2e0f,#5a4318);border-color:var(--gold);color:var(--gold-bright);font-weight:600}
.btn.small{padding:5px 10px;font-size:.82em}
.btn.choice{width:100%;text-align:left;justify-content:flex-start;margin-bottom:8px;padding:12px 16px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.title-wrap{text-align:center;padding:5vh 20px 40px;max-width:700px;margin:0 auto}
.title-deco{height:2px;background:linear-gradient(90deg,transparent,var(--gold-dim),var(--gold),var(--gold-dim),transparent);margin:22px auto;width:70%;position:relative}
.title-deco::before,.title-deco::after{content:'✦';position:absolute;top:50%;transform:translateY(-50%);color:var(--gold)}
.title-deco::before{left:-12px}.title-deco::after{right:-12px}
.title-main{font-size:clamp(1.8rem,5.5vw,2.9rem);color:var(--gold-bright);font-weight:normal;text-shadow:0 0 30px rgba(201,162,39,.35)}
.title-sub{color:var(--text-dim);font-size:1.05em;margin-top:6px;font-style:italic}
.title-lore{margin:22px 0;color:var(--text-dim)}.title-lore p{margin-bottom:10px}
.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:26px 28px;box-shadow:var(--shadow)}
.form-label{display:block;color:var(--text-dim);margin-bottom:8px;font-size:.95em}
input[type=text]{width:100%;max-width:300px;padding:12px 16px;background:var(--bg-deep);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:1.1em;text-align:center}
input[type=text]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.15)}
.trait-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
@media(max-width:560px){.trait-grid{grid-template-columns:1fr}}
.trait-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .2s;text-align:left}
.trait-card:hover,.trait-card.selected{border-color:var(--gold);background:#1f2630;box-shadow:0 0 12px rgba(201,162,39,.2)}
.trait-card h4{color:var(--gold-bright);font-weight:normal;margin-bottom:6px}
.trait-card p{font-size:.88em;color:var(--text-dim)}
.game-header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.location-name{font-size:1.35em;color:var(--gold-bright)}
.environment{display:flex;gap:10px;flex-wrap:wrap;font-size:.88em;color:var(--text-dim)}
.environment span{background:var(--bg-card);padding:3px 10px;border-radius:20px;border:1px solid var(--border)}
.path-progress{display:flex;align-items:center;gap:2px;margin-bottom:12px;overflow-x:auto;padding:6px 0}
.path-step{flex:1;min-width:48px;text-align:center;font-size:.62em;color:var(--text-muted)}
.path-step .dot{width:10px;height:10px;border-radius:50%;background:var(--border);margin:0 auto 3px;border:2px solid var(--bg-deep)}
.path-step.done .dot{background:var(--gold-dim)}
.path-step.current .dot{background:var(--gold);box-shadow:0 0 10px var(--gold);animation:glow 2s infinite}
.path-step.current{color:var(--gold-bright);font-weight:600}
.path-line{flex:0 0 8px;height:2px;background:var(--border);margin-bottom:14px}
.path-step.done+.path-line{background:var(--gold-dim)}
.act-badge{display:inline-block;background:var(--bg-card);border:1px solid var(--gold-dim);color:var(--gold);font-size:.75em;padding:2px 10px;border-radius:12px;margin-bottom:8px;letter-spacing:.04em}
.status-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 12px;background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px}
.stat-label{display:flex;justify-content:space-between;font-size:.78em;color:var(--text-dim);margin-bottom:2px}
.bar{height:7px;background:var(--bg-deep);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .45s}
.bar-fill.hp{background:linear-gradient(90deg,#2ea043,#3fb950)}
.bar-fill.stamina{background:linear-gradient(90deg,#1f6feb,#58a6ff)}
.bar-fill.hunger{background:linear-gradient(90deg,#9e6a03,#d29922)}
.bar-fill.xp{background:linear-gradient(90deg,#8957e5,#a371f7)}
.condition{font-size:.82em;color:var(--text-dim);margin:6px 0 10px;padding:6px 10px;background:var(--bg-card);border-radius:8px;border:1px solid var(--border)}
.condition.warn{color:#d29922;border-color:#6a4a10}
.condition.bad{color:var(--danger);border-color:#5c2b2b}
.game-main{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.description p{margin-bottom:11px}
.location-art{text-align:center;font-size:1.4em;letter-spacing:.1em;color:var(--gold-dim);margin-bottom:12px;opacity:.85}
.actions{display:flex;flex-wrap:wrap;gap:9px}
.action-btn{flex:1 1 140px}
.game-bottom{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.game-bottom{grid-template-columns:1fr}}
.inventory-box,.log-box{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px;max-height:200px;overflow-y:auto}
.box-title{font-size:.82em;color:var(--gold);margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase}
.inv-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.inv-item:last-child{border-bottom:none}
.inv-icon{font-size:1.2em;width:26px;text-align:center}
.inv-name{font-size:.93em}.inv-desc{display:block;font-size:.76em;color:var(--text-muted)}
.inv-count{color:var(--text-dim);font-size:.88em;margin-left:auto}
.log-entry{font-size:.86em;padding:4px 0;border-bottom:1px solid rgba(48,54,61,.5)}
.log-entry.good{color:var(--good)}.log-entry.bad{color:var(--danger)}.log-entry.story{color:var(--story)}
.log-entry.info{color:var(--text-dim)}.log-entry.combat{color:#79c0ff}.log-entry.thought{color:var(--thought);font-style:italic}
.levelup-panel{text-align:center;padding:8px 0}
.levelup-panel h3{color:var(--gold-bright);margin-bottom:6px;font-weight:normal}
.levelup-panel .btn{margin:5px}
.combat-arena{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:560px){.combat-arena{grid-template-columns:1fr}}
.combatant{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.combatant.enemy{border-color:#5c2b2b;background:linear-gradient(180deg,#1a1212,#161b22)}
.combatant h3{color:var(--gold-bright);font-weight:normal;margin-bottom:4px;font-size:1.15em}
.enemy-art{text-align:center;font-size:2.3em;margin:6px 0}
.enemy-desc{font-size:.86em;color:var(--text-dim);margin-bottom:10px;font-style:italic}
.combat-actions{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}
.combat-log{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px;max-height:170px;overflow-y:auto}
.scene-wrap{max-width:680px;margin:3vh auto}
.scene-text p{margin-bottom:14px;font-size:1.05em}
.scene-choices{margin-top:20px}
.end-wrap{max-width:680px;margin:3vh auto;text-align:center}
.end-title{color:var(--gold-bright);font-size:1.85em;font-weight:normal;margin-bottom:4px}
.end-subtitle{color:var(--text-dim);font-style:italic;margin-bottom:16px}
.end-text p{margin-bottom:11px;color:var(--text);text-align:left}
.end-stats{margin:18px 0;text-align:left;background:var(--bg-card);border-radius:8px;padding:12px 16px}
.end-stats h4{color:var(--gold);margin-bottom:8px;font-weight:normal}
.stat-row{display:flex;justify-content:space-between;padding:3px 0;font-size:.9em;border-bottom:1px solid var(--border)}
.end-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.end-tag{background:var(--bg-card);border:1px solid var(--border);padding:4px 12px;border-radius:20px;font-size:.82em;color:var(--text-dim)}
.key-list{text-align:left;margin:12px 0;padding:10px 14px;background:var(--bg-card);border-radius:8px;border:1px solid var(--border);font-size:.9em}
.key-list li{margin:4px 0 4px 18px;color:var(--text-dim)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-panel{background:var(--bg-panel);border:1px solid var(--gold-dim);border-radius:var(--radius);padding:24px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow)}
.modal-panel h3{color:var(--gold-bright);font-weight:normal;margin-bottom:10px}
.modal-panel p{color:var(--text-dim);margin-bottom:16px;font-size:.95em}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const roll=s=>1+Math.floor(Math.random()*s);
const randInt=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const chance=p=>Math.random()<p;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const SAVE_KEY='rivendell_hobbit_v6';

const EAT_LOCS=new Set(['bree','rivendell','rivendell_leave','fangorn','rohan','minas_tirith']);

const WEATHER={clear:{name:'Ясно',icon:'☀'},cloudy:{name:'Облачно',icon:'☁'},rain:{name:'Дождь',icon:'🌧'},fog:{name:'Туман',icon:'🌫'},storm:{name:'Гроза',icon:'⛈'}};
const TIMES={day:{name:'День',icon:'☀'},evening:{name:'Вечер',icon:'🌆'},night:{name:'Ночь',icon:'🌙'}};
const TRAITS={
  curious:{name:'Любопытный',desc:'Чаще находит тайны.',bonuses:{luck:2,courage:0}},
  careful:{name:'Осторожный',desc:'Легче прячется и сбегает.',bonuses:{luck:1,courage:-1},startFood:-1},
  stubborn:{name:'Упрямый',desc:'Лучше дерётся и терпит голод.',bonuses:{courage:2,luck:-1}},
  dreamer:{name:'Мечтательный',desc:'Больше знаков. Слабее в бою.',bonuses:{luck:1,courage:1}}
};
const ITEMS={
  food:{name:'Еда',desc:'Есть — только в тавернах и приютах.',icon:'🍞'},
  herbs:{name:'Лечебные травы',desc:'Атэлас и полевые травы.',icon:'🌿'},
  elvenBread:{name:'Эльфийский хлеб',desc:'Лембас. Можно в пути и в бою.',icon:'✨'},
  torch:{name:'Факел',desc:'Свет в темноте.',icon:'🔥'},
  armor:{name:'Кольчуга',desc:'Лёгкая защита.',icon:'🛡️'},
  ring:{name:'Кольцо',desc:'Холодное на ощупь.',icon:'💍'},
  pipeweed:{name:'Трубочное зелье',desc:'Кусочек дома.',icon:'🍃'},
  sword:{name:'Клинок Запада',desc:'Эльфийская или гондорская сталь.',icon:'⚔️'}
};
const ENEMIES={
  wolf:{name:'Волк',desc:'Голодный, с горящими глазами.',hp:18,defense:9,dmg:[2,6],xp:10,art:'🐺'},
  bandit:{name:'Разбойник',desc:'Оборванец с ножом.',hp:24,defense:10,dmg:[3,7],xp:14,art:'🗡️'},
  goblin:{name:'Гоблин',desc:'Визгливый и злобный.',hp:22,defense:10,dmg:[3,8],xp:12,art:'👺'},
  troll:{name:'Тролль',desc:'Огромный и сильный.',hp:50,defense:12,dmg:[5,11],xp:32,art:'👹'},
  spider:{name:'Огромный паук',desc:'Ядовитые жвалы.',hp:30,defense:11,dmg:[4,8],xp:18,art:'🕷️'},
  rider:{name:'Чёрный всадник',desc:'Холод и ужас.',hp:80,defense:14,dmg:[9,16],xp:65,art:'🏇'},
  orc:{name:'Орк',desc:'Скрипучий доспех, кривая сабля.',hp:24,defense:11,dmg:[3,8],xp:14,art:'😈'},
  uruk:{name:'Урук-хай',desc:'Крупнее орка, сильнее и злее.',hp:38,defense:12,dmg:[5,11],xp:26,art:'👿'},
  warg:{name:'Варг',desc:'Огромный волк под седлом орка.',hp:32,defense:11,dmg:[4,9],xp:20,art:'🐕'},
  nazgul:{name:'Назгул',desc:'Безликий ужас.',hp:95,defense:15,dmg:[11,20],xp:95,art:'👻'}
};
const PATH_ACT1=['Хоббитон','Дорога','Бри','Чаща','Тролли','Горы','Пещеры','Перевал','Ривенделл'];
const PATH_ACT2=['Ривенделл','Юг','Изенгард','Фангорн','Рохан','Пеленнор','Минас Тирит','К Мордору','Ородруин'];
const LOCATION_ART={
  hobbiton:'🌿 🏠 🌳',bree_road:'🌾 ～ 🛤️',bree:'🍺 🏡 🔥',forest:'🌲 🌲 🌲',
  trolls:'🪨 👹 🪨',mountains:'⛰️ ☁️ ⛰️',caves:'🕳️ 👺 🔦',last:'🌄 ～ 🍃',
  rivendell:'🏞️ ✨ 🏛️',south_road:'🛤️ 🌄 🌬️',isengard:'🏭 🌑 🗼',fangorn:'🌳 🌳 👁️',
  rohan:'🐴 🌾 🏰',pelennor:'⚔️ 🌅 🐎',minas_tirith:'🏰 🤍 ⛰️',mordor_road:'🌋 ⬛ 🔥',orodrui:'🌋 💍 🔥'
};

const LOC_ACT1=[
  {id:'hobbiton',name:'Хоббитон и окрестности',art:'hobbiton',act:1,
    desc:['Солнце золотит холмы Хоббитона.','Ты на пороге. Впереди — дорога.','В котомке мало еды и старый кинжал.'],
    specials:[
      {id:'pack',label:'Собрать котомку',once:true,run:()=>{state.player.inventory.food+=3;state.player.inventory.herbs+=1;state.player.inventory.torch+=1;gainXp(4);addLog('Хлеб, сыр, травы, факел.','good');markKey('Собрал котомку');}},
      {id:'farewell',label:'Попрощаться с родными',once:true,run:()=>{state.player.courage+=1;state.flags.saidFarewell=true;gainXp(3);addLog('Объятия и напутствия.','good');markKey('Попрощался с родными');}}
    ],leaveLabel:'Отправиться в путь',onLeave:()=>addLog('Хоббитон позади.','story')},
  {id:'bree_road',name:'Дорога к Бри',art:'bree_road',act:1,
    desc:['Дорога меж полей.','Дикие земли ближе.','К вечеру — огни Бри.'],
    specials:[{id:'forage',label:'Собрать ягоды / коренья',once:true,run:()=>{state.player.inventory.food+=1;gainXp(3);addLog('Ягоды и коренья.','good');}}],
    leaveLabel:'Идти к Бри',onLeave:()=>addLog('К чужим огням.','story')},
  {id:'bree',name:'Бри — «Гарцующий пони»',art:'bree',act:1,
    desc:['Тёплый свет, эль, песни.','Человек в сером у камина.','Здесь можно поесть и перевести дух.'],
    specials:[
      {id:'tavern',label:'Войти в таверну',once:true,run:()=>{state.player.courage+=1;state.player.inventory.food+=2;gainXp(4);addLog('Эль, похлёбка. +2 еды.','good');}},
      {id:'stranger',label:'Подойти к человеку в сером',once:true,run:()=>startScene('stranger_grey')},
      {id:'innkeeper',label:'Поговорить с трактирщиком',once:true,run:()=>{if(roll(20)>=11){state.player.inventory.elvenBread+=1;gainXp(3);addLog('Лембас от Барлимана.','good');}else{state.player.inventory.food+=1;addLog('Краюха хлеба и совет: осторожнее на востоке.','info');}}},
      {id:'sleep',label:'Переночевать',once:true,run:()=>{state.player.hp=clamp(state.player.hp+15,0,state.player.maxHp);state.player.stamina=clamp(state.player.stamina+12,0,state.player.maxStamina);state.player.hunger=clamp(state.player.hunger-10,0,state.player.maxHunger);advanceTime();gainXp(2);addLog('Сон в постели.','good');}}
    ],leaveLabel:'Выйти из Бри',onLeave:()=>{state.player.inventory.food+=1;addLog('Паёк на дорогу. Восточная тропа.','story');}},
  {id:'forest',name:'Чаща и старая дорога',art:'forest',act:1,
    desc:['Деревья смыкаются.','Запах мха.','Тише с каждым шагом.'],
    specials:[
      {id:'wounded',label:'Осмотреть придорожный куст',once:true,run:()=>startScene('wounded_man')},
      {id:'forage2',label:'Искать грибы / орехи',once:true,run:()=>{if(roll(20)+state.player.luck>=10){state.player.inventory.food+=1;gainXp(3);addLog('Орехи и грибы.','good');}else addLog('Пусто.','info');}}
    ],leaveLabel:'Идти дальше',onLeave:()=>addLog('Каменные силуэты впереди.','story')},
  {id:'trolls',name:'Камни троллей',art:'trolls',act:1,
    desc:['Три каменные фигуры.','Старые кости и котелок.','Можно обыскать или подойти ближе.'],
    specials:[
      {id:'search_trolls',label:'Обыскать лагерь троллей',once:true,run:()=>{const c=roll(20)+state.player.luck+Math.floor(state.player.courage/2);if(c>=14){state.player.inventory.armor+=1;state.player.armor=1;state.player.inventory.food+=2;gainXp(6);addLog('Кольчуга и провизия.','good');}else if(c>=8){state.player.inventory.food+=1;gainXp(3);addLog('Немного мяса.','info');}else addLog('Пыль и кости.','info');}},
      {id:'troll_choice',label:'Подойти ближе к камням',once:true,run:()=>startScene('troll_scene')}
    ],leaveLabel:'Уйти от камней',onLeave:()=>addLog('К Туманным горам.','story')},
  {id:'mountains',name:'Подступы к Туманным горам',art:'mountains',act:1,
    desc:['Серая стена гор.','Ледяной ветер.','Говорят, здесь гоблины.'],
    specials:[{id:'cache',label:'Обыскать тайник путников',once:true,run:()=>{state.player.inventory.food+=1;state.player.inventory.torch+=1;gainXp(4);addLog('Сухари и огарок факела.','good');}}],
    leaveLabel:'Подняться выше',onLeave:()=>addLog('Подъём.','story')},
  {id:'caves',name:'Пещеры Туманных гор',art:'caves',act:1,
    desc:['Разлом, сырость.','Владения гоблинов.','Нужно быть тихим.'],
    specials:[
      {id:'sneak',label:'Красться осторожно',once:true,run:()=>{const b=state.player.trait==='careful'?4:0;if(roll(20)+state.player.luck+b>=13){state.player.inventory.herbs+=1;state.player.inventory.food+=1;gainXp(6);addLog('Мимо патруля. Грибы и мясо.','good');state.flags.sneakedWell=true;}else{addLog('Гоблины!','bad');startCombat('goblin');}}},

    courage:5+(t.bonuses.courage||0),luck:5+(t.bonuses.luck||0),weapon:1,armor:0,hasRing:false,
    inventory:{food:3,herbs:1,torch:0,elvenBread:0,armor:0,ring:0,pipeweed:0,sword:0}};
  if(t.startFood)p.inventory.food=Math.max(1,p.inventory.food+t.startFood);
  return p;
}
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}}
function loadGame(){try{const r=localStorage.getItem(SAVE_KEY);if(!r)return false;const d=JSON.parse(r);if(!d||!d.player)return false;state=d;if(!state.keyChoices)state.keyChoices=[];return true;}catch(e){return false;}}
function hasSave(){try{return!!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function addLog(t,type='info'){state.log.push({text:t,type});if(state.log.length>90)state.log.shift();}
function addThought(t){state.log.push({text:'💭 '+t,type:'thought'});if(state.log.length>90)state.log.shift();}
function markKey(label){if(!state.keyChoices)state.keyChoices=[];if(!state.keyChoices.includes(label))state.keyChoices.push(label);}

function gainXp(n){if(!state.player||!n)return;state.player.xp+=n;addLog('+'+n+' опыта.','info');checkLevelUp();}
function checkLevelUp(){
  const p=state.player;
  while(p.xp>=p.xpNext&&p.level<12){
    p.xp-=p.xpNext;p.level++;p.xpNext=Math.round(14+p.level*7);
    p.maxHp+=5;p.hp=Math.min(p.maxHp,p.hp+5);p.maxStamina+=2;p.stamina=Math.min(p.maxStamina,p.stamina+2);p.courage+=1;
    state.pendingLevelUp=true;addLog('Уровень '+p.level+'!','story');
  }
}
function applyLevelUpChoice(c){
  const p=state.player;
  if(c==='hp'){p.maxHp+=3;p.hp+=3;addLog('+3 HP.','good');}
  else if(c==='stamina'){p.maxStamina+=2;p.stamina+=2;addLog('+2 выносливости.','good');}
  else if(c==='luck'){p.luck+=1;addLog('+1 удачи.','good');}
  else if(c==='weapon'){p.weapon+=1;addLog('+1 урона.','good');}
  state.pendingLevelUp=false;render();saveGame();
}
function summarizeAct1(){
  ['— Итог до Ривенделла —',
    state.flags.helpedWounded?'Помог раненому.':null,
    state.flags.leftRingOnRoad?'Оставил Кольцо на дороге.':null,
    state.flags.ringFound?'Несёт Кольцо.':null,
    'Уровень '+state.player.level+'.'
  ].filter(Boolean).forEach(l=>addLog(l,'story'));
}
function advanceTime(){
  const o=['day','evening','night'];const i=o.indexOf(state.time);
  if(i===2){state.time='day';state.day++;}else state.time=o[i+1];
  if(chance(.35))state.weather=pick(['clear','cloudy','rain','fog','storm']);
  if(state.time==='night'&&chance(.18)){
    if((state.player.hasRing||state.player.inventory.ring>0)&&chance(.4))startScene('ring_whisper');
    else if(chance(.25)){addLog('Странные звуки ночью.','info');state.player.stamina=clamp(state.player.stamina-2,0,state.player.maxStamina);}
  }
}
function applyHunger(){
  const p=state.player;state.stats.maxHunger=Math.max(state.stats.maxHunger,p.hunger);
  const r=p.trait==='stubborn'?.5:1;
  if(p.hunger>=90){const d=Math.ceil(3*r);p.hp-=d;addLog('Голод: −'+d+' HP.','bad');}
  else if(p.hunger>=70){const d=Math.ceil(1*r);p.hp-=d;addLog('Голод: −'+d+' HP.','bad');}
  if(p.hp<=0){p.hp=0;onPlayerDeath('hunger');}
}
function getConditionText(){
  const p=state.player;
  if(p.hp/p.maxHp<.3||p.hunger>=80)return{t:'На пределе.',cls:'bad'};
  if(p.hunger>=55||p.stamina/p.maxStamina<.35)return{t:'Устал и голоден.',cls:'warn'};
  if(state.act===2)return{t:'Юг жёстче севера.',cls:''};
  return{t:'Держишься.',cls:''};
}
function takeSnapshot(){
  try{
    state.snapshot={
      act:state.act,locationIndex:Math.max(0,state.locationIndex-3),
      player:JSON.parse(JSON.stringify(state.player)),
      flags:JSON.parse(JSON.stringify(state.flags)),
      usedActions:JSON.parse(JSON.stringify(state.usedActions)),
      time:state.time,day:state.day,weather:state.weather,
      keyChoices:(state.keyChoices||[]).slice(),
      stats:JSON.parse(JSON.stringify(state.stats))
    };
  }catch(e){state.snapshot=null;}
}
function onPlayerDeath(reason){state.combat=null;state.scene=null;state.screen='death';state.deathReason=reason||'combat';render();}
function deathRestart(){state=newGameState();state.screen='char';render();}
function deathRewind(){
  if(!state.snapshot){deathRestart();return;}
  const s=state.snapshot;
  state.act=s.act;state.locationIndex=s.locationIndex;state.player=s.player;
  state.player.hp=Math.max(8,Math.floor(state.player.maxHp*0.55));
  state.player.stamina=Math.max(5,Math.floor(state.player.maxStamina*0.5));
  state.player.hunger=Math.min(state.player.hunger,50);
  if(state.player.inventory.food<2)state.player.inventory.food=2;
  state.flags=s.flags;state.usedActions=s.usedActions;
  state.time=s.time;state.day=s.day;state.weather=s.weather;
  state.keyChoices=s.keyChoices||[];state.stats=s.stats;
  state.combat=null;state.scene=null;state.pendingLevelUp=false;state.screen='game';
  addLog('Тьма отступает… Ты приходишь в себя раньше на дороге.','story');
  render();saveGame();
}

function doSearch(){
  const loc=getLocations()[state.locationIndex];
  state.usedActions[loc.id+'_search']=true;
  state.player.stamina=clamp(state.player.stamina-2,0,state.player.maxStamina);
  state.player.hunger=clamp(state.player.hunger+3+(state.act===2?2:0),0,state.player.maxHunger);
  const b=state.player.trait==='curious'?3:0;
  const r=roll(20)+Math.floor(state.player.luck/2)+b;
  if(r>=15){const f=pick(['food','food','herbs','torch']);state.player.inventory[f]=(state.player.inventory[f]||0)+1;gainXp(4);addLog('Находка: '+ITEMS[f].name+'.','good');}
  else if(r>=10){gainXp(2);addLog('Ничего ценного.','info');}
  else if(r>=5){gainXp(1);addLog('Пусто.','info');}
  else{addLog('Кто-то рядом...','bad');if(chance(.5))triggerEvent(true);else{startCombat(pick(state.act===2?['orc','warg']:['wolf','bandit','goblin']));return;}}
  applyHunger();if(state.player.hp<=0)return;render();saveGame();
}
function doRest(){
  const p=state.player;let rest=state.act===2?5:8;if(p.trait==='stubborn')rest=Math.max(4,rest-2);
  p.stamina=clamp(p.stamina+rest,0,p.maxStamina);p.hunger=clamp(p.hunger+6+(state.act===2?4:0),0,p.maxHunger);
  advanceTime();gainXp(1);addLog(state.act===2?'Тревожный отдых.':'Отдых.','info');
  if(chance(.22+(state.act===2?.1:0)))triggerEvent();
  applyHunger();if(state.player.hp<=0)return;render();saveGame();
}
function doEat(){
  if(!canEatHere()){addLog('Здесь нельзя поесть — только в тавернах и приютах. В пути — лембас.','info');render();return;}
  const p=state.player;if(p.inventory.food<=0){addLog('Нет еды.','bad');render();return;}
  p.inventory.food--;p.hunger=clamp(p.hunger-22,0,p.maxHunger);p.hp=clamp(p.hp+6,0,p.maxHp);
  state.stats.foodEaten++;gainXp(1);addLog('Перекус у огня.','good');render();saveGame();
}
function doLeave(){
  takeSnapshot();
  const locs=getLocations();const loc=locs[state.locationIndex];
  const prevAct=state.act,prevIndex=state.locationIndex;
  state.flags.leaveBlocked=false;
  if(loc.onLeave)loc.onLeave();
  if(state.screen==='scene'||state.screen==='combat'||state.screen==='end'||state.screen==='death')return;
  if(state.flags.leaveBlocked){render();saveGame();return;}
  if(state.act!==prevAct){gainXp(5);render();saveGame();return;}
  if(state.locationIndex!==prevIndex){render();saveGame();return;}
  if(state.locationIndex>=locs.length-1){
    if(loc.id==='rivendell'){render();saveGame();return;}
    if(loc.id==='orodruin'){if(!state.flags.destroyedRing&&!state.flags.keptRing&&!state.flags.noRingEnd)startScene('mount_doom');return;}
    finishGame();return;
  }
  state.locationIndex++;state.stats.stepsTaken++;
  state.player.stamina=clamp(state.player.stamina-4-(state.act===2?1:0),0,state.player.maxStamina);
  state.player.hunger=clamp(state.player.hunger+7+(state.act===2?4:0),0,state.player.maxHunger);
  gainXp(2);advanceTime();
  if(state.act===1&&state.locationIndex===4&&!state.flags.riderMet&&chance(.35)){state.flags.riderMet=true;startScene('rider_approach');return;}
  if(chance(.38))triggerEvent();
  if(state.player.hp<=0)return;
  if(state.screen==='combat'||state.screen==='scene'||state.screen==='death')return;
  addLog('Прибытие: '+getLocations()[state.locationIndex].name+'.','story');
  applyHunger();if(state.player.hp<=0)return;render();saveGame();
}

const EVENTS=[
  {id:'food',w:11,run:()=>{const n=randInt(1,2);state.player.inventory.food+=n;gainXp(2);addLog('Припасы (+'+n+').','good');}},
  {id:'herbs',w:7,run:()=>{state.player.inventory.herbs+=1;gainXp(2);addLog('Травы.','good');}},
  {id:'wolf',w:5,run:()=>{addLog('Волк!','bad');startCombat('wolf');}},
  {id:'bandit',w:4,run:()=>{addLog('Разбойник.','bad');startCombat('bandit');}},
  {id:'goblin',w:4,run:()=>{addLog('Гоблины!','bad');startCombat('goblin');}},
  {id:'orc',w:5,run:()=>{addLog('Орк!','bad');startCombat('orc');}},
  {id:'uruk',w:3,run:()=>{addLog('Урук-хай!','bad');startCombat('uruk');}},
  {id:'warg',w:3,run:()=>{addLog('Варг!','bad');startCombat('warg');}},
  {id:'traveler',w:8,run:()=>{state.player.inventory.food+=1;state.player.courage+=1;gainXp(3);addLog('Путник делится едой.','good');}},
  {id:'campfire',w:5,run:()=>{state.player.inventory.food+=1;gainXp(2);addLog('Хлеб у чужого костра.','info');}},
  {id:'weather',w:5,run:()=>{state.weather=pick(['rain','storm','fog']);state.player.stamina=clamp(state.player.stamina-3,0,state.player.maxStamina);addLog('Погода: '+WEATHER[state.weather].name+'.','info');}},
  {id:'lost',w:3,run:()=>{state.player.hunger=clamp(state.player.hunger+10,0,state.player.maxHunger);state.player.stamina=clamp(state.player.stamina-4,0,state.player.maxStamina);addLog('Сбились с пути.','bad');}},
  {id:'ring',w:1,run:()=>{if(state.player.inventory.ring>0||state.flags.ringFound||state.flags.leftRingOnRoad){addLog('Странный холод.','info');return;}state.player.inventory.ring=1;state.player.hasRing=true;state.flags.ringFound=true;state.stats.ringsFound++;gainXp(6);addLog('Золотое кольцо под корнем.','story');markKey('Нашёл Кольцо');}},
  {id:'rider_far',w:2,run:()=>{addLog('Вдалеке — чёрный всадник.','bad');state.player.courage=clamp(state.player.courage-1,1,20);}}
];
function triggerEvent(forceBad=false){
  state.stats.eventsSeen++;
  let pool=EVENTS;
  if(forceBad)pool=EVENTS.filter(e=>['wolf','bandit','goblin','orc','uruk','warg','lost'].includes(e.id));
  if(state.act===1)pool=pool.filter(e=>!['orc','uruk','warg'].includes(e.id));
  const tot=pool.reduce((s,e)=>s+e.w,0);let r=Math.random()*tot;
  for(const e of pool){r-=e.w;if(r<=0){e.run();return;}}
  pool[0].run();
}

function playerPower(){const p=state.player;return p.level*2.5+p.weapon*2+p.armor*1.5+Math.floor(p.maxHp/12)+(p.inventory.sword>0?1.5:0);}
function scaleEnemy(base){
  const power=playerPower();
  let scale=Math.min(2.1,Math.max(1.05,0.75+power/24));
  if(base.name==='Орк'||base.name==='Варг')scale=Math.min(scale,1.35);
  if(base.name==='Урук-хай')scale=Math.min(scale,1.55);
  const v=0.94+Math.random()*0.12;
  const hp=Math.round(base.hp*scale*v);
  const dmgMin=Math.max(2,Math.round(base.dmg[0]*scale*v));
  const dmgMax=Math.max(dmgMin+1,Math.round(base.dmg[1]*scale*v));
  return{name:base.name,desc:base.desc,art:base.art,hp,maxHp:hp,defense:Math.max(8,Math.round(base.defense*(0.88+scale*0.12))),dmgMin,dmgMax,xp:Math.round(base.xp*(0.95+scale*0.3))};
}
function startCombat(id){
  const b=ENEMIES[id];if(!b)return;
  takeSnapshot();
  state.combat={enemy:scaleEnemy(b),log:[],playerDefending:false,playerBuffed:0};
  state.screen='combat';addCombatLog('Бой: '+b.name+'.','combat');render();
}
function addCombatLog(t,type='combat'){if(!state.combat)return;state.combat.log.push({text:t,type});if(state.combat.log.length>28)state.combat.log.shift();}
function playerAttack(){
  const c=state.combat,p=state.player;if(!c)return;
  let atk=p.weapon+Math.floor(p.level/2)+(c.playerBuffed>0?2:0)+(p.inventory.sword>0?1:0);
  if(p.trait==='stubborn')atk+=1;if(p.trait==='dreamer')atk-=1;
  const pen=p.stamina<=0?-3:(p.stamina<3?-1:0);const r=roll(20);const tot=r+atk+pen;
  p.stamina=clamp(p.stamina-1,0,p.maxStamina);
  if(r===20||tot>=c.enemy.defense+8){const d=randInt(2,6)+p.weapon*2+Math.floor(p.level/2)+4;c.enemy.hp-=d;state.stats.damageDealt+=d;addCombatLog('Крит! '+d+'.','good');}
  else if(tot>=c.enemy.defense){const d=randInt(2,6)+p.weapon*2+Math.floor(p.level/2);c.enemy.hp-=d;state.stats.damageDealt+=d;addCombatLog('Удар: '+d+'.','combat');}
  else addCombatLog('Промах.','info');
  if(c.playerBuffed>0)c.playerBuffed--;
  if(c.enemy.hp<=0){endCombat(true);return;}enemyTurn();
}
function playerDefend(){state.combat.playerDefending=true;state.player.stamina=clamp(state.player.stamina+1,0,state.player.maxStamina);addCombatLog('Защита.','info');enemyTurn();}
function playerFlee(){
  const c=state.combat,p=state.player;if(!c)return;
  let ch=.4+p.luck*.03+(p.stamina>5?.12:0);if(p.trait==='careful')ch+=.15;
  if(c.enemy.name.includes('Всадник')||c.enemy.name.includes('Назгул'))ch-=.2;
  if(Math.random()<ch){addCombatLog('Сбежал!','good');state.stats.battlesFled++;gainXp(2);state.combat=null;state.screen='game';render();saveGame();}
  else{addCombatLog('Не удалось.','bad');enemyTurn();}
}
function playerRing(){
  const c=state.combat,p=state.player;if(!c||p.inventory.ring<=0)return;
  state.flags.woreRing=true;state.flags.woreRingCount=(state.flags.woreRingCount||0)+1;
  addCombatLog('Кольцо.','story');c.playerBuffed=2;enemyTurn();
}
function playerRally(){
  const c=state.combat,p=state.player;if(!c||p.courage<6){addCombatLog('Мало смелости.','info');return;}
  p.stamina=clamp(p.stamina+3,0,p.maxStamina);c.playerBuffed=1;addCombatLog('Собрался с духом!','good');enemyTurn();
}
function playerUseItem(key){
  const c=state.combat,p=state.player;if(!c||!p.inventory[key]||p.inventory[key]<=0)return;
  if(key==='herbs'){p.inventory.herbs--;p.hp=clamp(p.hp+12,0,p.maxHp);addCombatLog('+12 HP.','good');}
  else if(key==='elvenBread'){p.inventory.elvenBread--;p.hp=clamp(p.hp+18,0,p.maxHp);p.hunger=clamp(p.hunger-15,0,p.maxHunger);addCombatLog('Лембас!','good');}
  else if(key==='food'){addCombatLog('В бою — только травы или лембас.','info');return;}
  else return;enemyTurn();
}
function enemyTurn(){
  const c=state.combat,p=state.player;if(!c||c.enemy.hp<=0)return;
  const e=c.enemy;const r=roll(20);let hit=10+Math.floor(p.level/2)+(p.armor>0?2:0);if(c.playerDefending)hit+=4;
  if(r===1)addCombatLog(e.name+' промах.','info');
  else if(r+2>=hit){let d=randInt(e.dmgMin,e.dmgMax);if(c.playerDefending)d=Math.max(1,Math.floor(d/2));if(p.armor>0)d=Math.max(1,d-1);p.hp-=d;state.stats.damageTaken+=d;addCombatLog(e.name+': '+d+'.','bad');}
  else addCombatLog(e.name+' мимо.','info');
  c.playerDefending=false;
  if(p.hp<=0){p.hp=0;endCombat(false);return;}render();
}
function endCombat(won){
  if(!state.combat)return;
  if(won){state.player.xp+=state.combat.enemy.xp;state.stats.battlesWon++;addLog('Победа! +'+state.combat.enemy.xp+' опыта.','good');
    if(chance(.35)){const d=pick(['food','herbs','torch']);state.player.inventory[d]=(state.player.inventory[d]||0)+1;addLog('Дроп: '+ITEMS[d].name+'.','good');}
    checkLevelUp();state.combat=null;state.screen='game';render();saveGame();
  }else{state.combat=null;onPlayerDeath('combat');}
}

function startScene(id){if(!SCENES[id])return;state.scene=id;state.sceneStep=0;state.screen='scene';render();}
function advanceScene(idx){
  const sc=SCENES[state.scene];if(!sc){state.screen='game';render();return;}
  const step=sc.steps[state.sceneStep];
  if(step&&step.choices&&step.choices[idx]){const ch=step.choices[idx];if(ch.requireRing&&!(state.player.inventory.ring>0||state.player.hasRing))return;ch.run();}
  state.sceneStep++;
  if(state.sceneStep>=sc.steps.length||state.screen==='combat'||state.screen==='end'||state.screen==='death'){
    if(state.screen!=='combat'&&state.screen!=='end'&&state.screen!=='death'){state.scene=null;state.screen='game';}
  }
  render();saveGame();
}
function finishGame(ending){state.ending=ending||'default';state.screen='end';state.combat=null;state.scene=null;clearSave();render();}

function buildEnding(){
  const p=state.player,f=state.flags,name=p?p.name:'хоббит';
  const tags=[];
  if(f.destroyedRing)tags.push('Уничтожил Кольцо');
  if(f.keptRing)tags.push('Сохранил Кольцо');
  if(f.noRingEnd||state.ending==='no_ring_end')tags.push('Без Кольца');
  if(f.ringFound)tags.push('Нашёл Кольцо');
  if(f.leftRingOnRoad)tags.push('Оставил Кольцо');
  if(f.metEnt)tags.push('Друг Энтов');
  if(f.rohanFriend)tags.push('Друг Рохана');
  if(p&&p.trait)tags.push(TRAITS[p.trait].name);
  let title,subtitle,paragraphs=[];
  if(state.ending==='destroyed'||f.destroyedRing){
    title='Конец Кольца';subtitle='Огонь Ородруина';
    paragraphs=['Кольцо падает в лаву.','Хоббит '+name+' стоит у края. Мир выдыхает.'];
  }else if(state.ending==='kept'||f.keptRing){
    title='Тень победила';subtitle='Кольцо осталось';
    paragraphs=['Пальцы не разжались.','История меняется не к лучшему.'];
  }else if(state.ending==='no_ring_end'||f.noRingEnd){
    title='Зря шёл?';subtitle='Кольца не было';
    paragraphs=[
      'Так... какое ещё кольцо? Нету никакого кольца у меня! Зря шёл..',
      'Хоббит '+name+' стоит у края Ородруина с пустыми руками и долгим путём за спиной.',
      'Может, Кольцо так и легло в траве у последнего перевала. Может, его и не суждено было нести.',
      'Домой всё равно далеко. Но теперь ясно: не каждый поход кончается легендой о Всевластье.'
    ];
  }else if(p&&p.hp<=0){
    title='Путь оборвался';subtitle='Тьма';
    paragraphs=['Хоббит '+name+' не дошёл до конца.'];
  }else if(state.act===2||f.choseSouth){
    title='Долгий путь';subtitle='До края';
    paragraphs=['От Хоббитона до тени Мордора.','Имя '+name+' будут помнить тихо.'];
  }else{
    title='Ривенделл';subtitle='Дом Элронда';
    paragraphs=['Путь от Хоббитона окончен — пока.'];
  }
  return{title,subtitle,paragraphs,tags,keys:state.keyChoices||[]};
}

function render(){
  const app=$('app');if(!app)return;if(!state)state=newGameState();
  if(state.screen==='title'){app.innerHTML=renderTitle();bindTitle();}
  else if(state.screen==='char'){app.innerHTML=renderChar();bindChar();}
  else if(state.screen==='game'){app.innerHTML=renderGame();bindGame();scrollLogs();}
  else if(state.screen==='combat'){app.innerHTML=renderCombat();bindCombat();scrollLogs();}
  else if(state.screen==='scene'){app.innerHTML=renderScene();bindScene();}
  else if(state.screen==='death'){app.innerHTML=renderDeath();bindDeath();}
  else if(state.screen==='end'){app.innerHTML=renderEnd();bindEnd();}
}
function scrollLogs(){const l=document.querySelector('.log-box');if(l)l.scrollTop=l.scrollHeight;const c=document.querySelector('.combat-log');if(c)c.scrollTop=c.scrollHeight;}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function renderTitle(){
  return`<div class="screen title-wrap"><div class="title-deco"></div>
    <h1 class="title-main">Поход в Средиземье</h1>
    <div class="title-sub">От Хоббитона до Ородруина</div>
    <div class="title-lore"><p>Дорога зовёт — в Ривенделл и, если хватит духу, к тени Мордора.</p></div>
    <div class="title-deco"></div>
    <div style="margin-top:18px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn primary" id="btn-new">Начать</button>
      ${hasSave()?'<button class="btn" id="btn-continue">Продолжить</button>':''}
    </div></div>`;
}
function bindTitle(){
  $('btn-new').onclick=()=>{state=newGameState();state.screen='char';render();};
  const c=$('btn-continue');if(c)c.onclick=()=>{if(loadGame()){if(state.screen==='death'||state.screen==='combat'){state.screen='game';state.combat=null;}render();}else{state=newGameState();state.screen='char';render();}};
}
function renderChar(){
  const traits=Object.keys(TRAITS).map(k=>`<div class="trait-card" data-trait="${k}"><h4>${TRAITS[k].name}</h4><p>${TRAITS[k].desc}</p></div>`).join('');
  return`<div class="screen" style="max-width:640px;margin:3vh auto"><div class="panel">
    <h2 style="color:var(--gold-bright);font-weight:normal;text-align:center;margin-bottom:12px">Кто ты?</h2>
    <div style="text-align:center"><label class="form-label" for="input-name">Имя</label>
      <input type="text" id="input-name" maxlength="20" placeholder="Фродо, Сэм..." autofocus></div>
    <div class="trait-grid">${traits}</div>
    <div style="text-align:center;margin-top:18px"><button class="btn primary" id="btn-create" disabled>В путь</button></div>
  </div></div>`;
}
function bindChar(){
  let selected=null;
  document.querySelectorAll('.trait-card').forEach(card=>{card.onclick=()=>{document.querySelectorAll('.trait-card').forEach(c=>c.classList.remove('selected'));card.classList.add('selected');selected=card.dataset.trait;$('btn-create').disabled=false;};});
  $('btn-create').onclick=()=>{if(!selected)return;const name=(($('input-name')||{}).value||'').trim()||'Фродо';
    state.player=newPlayer(name,selected);state.screen='game';state.act=1;state.locationIndex=0;state.log=[];
    addLog(name+', '+TRAITS[selected].name.toLowerCase()+' хоббит из Хоббитона.','story');saveGame();render();};
}
function renderStatus(){
  const p=state.player;const hp=p.hp/p.maxHp*100,st=p.stamina/p.maxStamina*100,hg=p.hunger/p.maxHunger*100,xp=p.xp/p.xpNext*100;
  return`<div class="status-panel ${hp<30?'low-hp':''}">
    <div><div class="stat-label"><span>❤️ HP</span><span>${p.hp}/${p.maxHp}</span></div><div class="bar"><div class="bar-fill hp" style="width:${hp}%"></div></div></div>
    <div><div class="stat-label"><span>⚡</span><span>${p.stamina}/${p.maxStamina}</span></div><div class="bar"><div class="bar-fill stamina" style="width:${st}%"></div></div></div>
    <div><div class="stat-label"><span>🍖</span><span>${p.hunger}/${p.maxHunger}</span></div><div class="bar"><div class="bar-fill hunger" style="width:${hg}%"></div></div></div>
    <div><div class="stat-label"><span>⭐${p.level}</span><span>${p.xp}/${p.xpNext}</span></div><div class="bar"><div class="bar-fill xp" style="width:${xp}%"></div></div></div>
    <div><div class="stat-label"><span>🦁 ${p.courage}</span><span>🍀 ${p.luck}</span></div></div>
  </div>`;
}
function renderEnv(){const t=TIMES[state.time],w=WEATHER[state.weather];return`<div class="environment"><span>${t.icon} ${t.name}</span><span>${w.icon} ${w.name}</span><span>📅 ${state.day}</span></div>`;}
function renderPath(){
  const names=getPathNames();let h='<div class="path-progress">';
  names.forEach((n,i)=>{if(i)h+='<div class="path-line"></div>';const cls=i<state.locationIndex?'done':(i===state.locationIndex?'current':'');h+=`<div class="path-step ${cls}"><div class="dot"></div>${n}</div>`;});
  return h+'</div>';
}
function getActions(){
  const loc=getLocations()[state.locationIndex];const p=state.player;const a=[];
  if(!state.usedActions[loc.id+'_search'])a.push({label:'🔍 Обыскать',run:doSearch});
  a.push({label:'😴 Отдохнуть',run:doRest});
  if(canEatHere()&&p.inventory.food>0)a.push({label:'🍞 Есть',run:doEat});
  (loc.specials||[]).forEach(s=>{const k=loc.id+'_sp_'+s.id;if(s.once&&state.usedActions[k])return;
    a.push({label:s.label,run:()=>{state.usedActions[k]=true;s.run();if(state.screen==='game'){saveGame();render();}}});});
  a.push({label:'➡️ '+(loc.leaveLabel||'Дальше'),run:doLeave});return a;
}
function renderLevelUp(){return`<div class="levelup-panel"><h3>✨ Уровень ${state.player.level}</h3>
  <button class="btn" data-choice="hp">❤️ +3 HP</button><button class="btn" data-choice="stamina">⚡ +2</button>
  <button class="btn" data-choice="luck">🍀 +1</button><button class="btn" data-choice="weapon">🗡️ +1 урон</button></div>`;}
function renderGame(){
  const loc=getLocations()[state.locationIndex];const p=state.player;
  let actHtml=state.pendingLevelUp?renderLevelUp():getActions().map((a,i)=>`<button class="btn action-btn" data-idx="${i}">${a.label}</button>`).join('');
  const inv=p.inventory;const items=[];
  ['food','herbs','elvenBread','torch','armor','ring','pipeweed','sword'].forEach(k=>{if(inv[k]>0)items.push({key:k,count:inv[k],usable:k==='elvenBread'||k==='herbs'||(k==='food'&&canEatHere())});});
  const invHtml=items.length?items.map(it=>`<div class="inv-item"><span class="inv-icon">${ITEMS[it.key].icon}</span><div style="flex:1"><span class="inv-name">${ITEMS[it.key].name}</span>
    <span class="inv-desc">${ITEMS[it.key].desc}</span></div><span class="inv-count">×${it.count}</span>
    ${it.usable?`<button class="btn small inv-use" data-item="${it.key}">Исп.</button>`:''}</div>`).join(''):'<div style="color:var(--text-dim);font-style:italic">Пусто</div>';
  const logHtml=state.log.slice(-14).map(l=>`<div class="log-entry ${l.type}">${escapeHtml(l.text)}</div>`).join('');
  const actBadge=state.act===2?'<div class="act-badge">АКТ II — Юг</div>':'<div class="act-badge">АКТ I — Ривенделл</div>';
  const cond=getConditionText();
  return`<div class="screen">${actBadge}${renderPath()}
    <header class="game-header"><div class="location-name">${loc.name}</div>${renderEnv()}</header>
    ${renderStatus()}<div class="condition ${cond.cls}">${cond.t}${canEatHere()?' · Здесь можно поесть.':''}</div>
    <div class="game-main"><div class="location-art">${LOCATION_ART[loc.art]||''}</div>
      <div class="description">${loc.desc.map(t=>`<p>${t}</p>`).join('')}</div>
      <div class="actions">${actHtml}</div></div>
    <div class="game-bottom"><div class="inventory-box"><div class="box-title">Инвентарь</div>${invHtml}</div>
      <div class="log-box"><div class="box-title">Лог</div>${logHtml}</div></div></div>`;
}
function bindGame(){
  document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>applyLevelUpChoice(b.dataset.choice));
  const acts=state.pendingLevelUp?[]:getActions();
  document.querySelectorAll('.action-btn').forEach(b=>{const i=+b.dataset.idx;b.onclick=()=>{if(acts[i])acts[i].run();};});
  document.querySelectorAll('.inv-use').forEach(b=>b.onclick=()=>useItem(b.dataset.item));
}
function useItem(key){
  const p=state.player;if(!p.inventory[key]||p.inventory[key]<=0)return;
  if(key==='food'){if(!canEatHere()){addLog('Обычную еду — только в приютах. В пути — лембас.','info');render();return;}doEat();return;}
  if(key==='herbs'){p.inventory.herbs--;p.hp=clamp(p.hp+12,0,p.maxHp);addLog('+12 HP.','good');}
  else if(key==='elvenBread'){p.inventory.elvenBread--;p.hp=clamp(p.hp+20,0,p.maxHp);p.hunger=clamp(p.hunger-25,0,p.maxHunger);addLog('Лембас.','good');}
  applyHunger();if(p.hp<=0)return;render();saveGame();
}
function renderCombat(){
  const c=state.combat;if(!c){state.screen='game';return render();}
  const p=state.player,e=c.enemy;const hp=p.hp/p.maxHp*100,st=p.stamina/p.maxStamina*100,ehp=Math.max(0,e.hp/e.maxHp*100);
  const log=c.log.slice(-10).map(l=>`<div class="log-entry ${l.type}">${escapeHtml(l.text)}</div>`).join('');
  const sp=[];if(p.inventory.ring>0)sp.push(`<button class="btn" data-combat="ring">💍</button>`);if(p.courage>=6)sp.push(`<button class="btn" data-combat="rally">🦁</button>`);
  const us=[];if(p.inventory.herbs>0)us.push({k:'herbs',l:'🌿'});if(p.inventory.elvenBread>0)us.push({k:'elvenBread',l:'✨'});
  const items=us.length?`<div style="width:100%;margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${us.map(u=>`<button class="btn small" data-combat="item" data-item="${u.k}">${u.l}</button>`).join('')}</div>`:'';
  return`<div class="screen"><header class="game-header"><div class="location-name">⚔️ Бой</div></header>
    <div class="combat-arena">
      <div class="combatant ${hp<30?'low-hp':''}"><h3>${escapeHtml(p.name)}</h3>
        <div style="display:flex;justify-content:space-between;font-size:.86em;color:var(--text-dim)"><span>HP</span><span>${p.hp}/${p.maxHp}</span></div>
        <div class="bar"><div class="bar-fill hp" style="width:${hp}%"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:.86em;color:var(--text-dim);margin-top:6px"><span>Вынос.</span><span>${p.stamina}/${p.maxStamina}</span></div>
        <div class="bar"><div class="bar-fill stamina" style="width:${st}%"></div></div></div>
      <div class="combatant enemy"><h3>${escapeHtml(e.name)}</h3><div class="enemy-art">${e.art}</div>
        <div class="enemy-desc">${escapeHtml(e.desc)}</div>
        <div style="display:flex;justify-content:space-between;font-size:.86em;color:var(--text-dim)"><span>HP</span><span>${Math.max(0,e.hp)}/${e.maxHp}</span></div>
        <div class="bar"><div class="bar-fill hp" style="width:${ehp}%"></div></div></div>
    </div>
    <div class="combat-actions">
      <button class="btn primary" data-combat="attack">🗡️</button><button class="btn" data-combat="defend">🛡️</button>
      <button class="btn" data-combat="flee">🏃</button>${sp.join('')}${items}
    </div>
    <div class="combat-log"><div class="box-title">Бой</div>${log}</div></div>`;
}
function bindCombat(){
  document.querySelectorAll('[data-combat]').forEach(b=>{
    const a=b.dataset.combat;
    b.onclick=()=>{if(a==='attack')playerAttack();else if(a==='defend')playerDefend();else if(a==='flee')playerFlee();
      else if(a==='ring')playerRing();else if(a==='rally')playerRally();else if(a==='item')playerUseItem(b.dataset.item);};
  });
}
function renderScene(){
  const sc=SCENES[state.scene];if(!sc)return renderGame();
  const step=sc.steps[state.sceneStep]||sc.steps[0];
  const ch=(step.choices||[]).filter(c=>!c.requireRing||(state.player.inventory.ring>0||state.player.hasRing));
  return`<div class="screen scene-wrap"><div class="panel">
    <h2 style="color:var(--gold-bright);font-weight:normal;text-align:center;margin-bottom:16px">${sc.title}</h2>
    <div class="scene-text">${step.text.map(t=>`<p>${t}</p>`).join('')}</div>
    <div class="scene-choices">${ch.map((c,i)=>`<button class="btn choice" data-choice-idx="${i}">${c.label}</button>`).join('')}</div>
  </div></div>`;
}
function bindScene(){document.querySelectorAll('[data-choice-idx]').forEach(b=>b.onclick=()=>advanceScene(+b.dataset.choiceIdx));}
function renderDeath(){
  return`<div class="screen"><div class="modal-overlay"><div class="modal-panel">
    <h3>Тьма сгустилась</h3>
    <p>Силы покинули тебя. Судьба ещё может дать шанс.</p>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${state.snapshot?'<button class="btn primary" id="btn-rewind">Очнуться раньше (≈3 шага назад)</button>':''}
      <button class="btn" id="btn-restart-char">Начать с выбора персонажа</button>
    </div>
  </div></div></div>`;
}
function bindDeath(){
  const r=$('btn-rewind');if(r)r.onclick=deathRewind;
  const c=$('btn-restart-char');if(c)c.onclick=deathRestart;
}
function renderEnd(){
  const end=buildEnding();const p=state.player,s=state.stats;
  const stats=[{l:'Боёв',v:s.battlesWon},{l:'Уровень',v:p?p.level:'—'},{l:'Шагов',v:s.stepsTaken}];
  const keysHtml=end.keys.length?`<div class="key-list"><h4 style="color:var(--gold);margin-bottom:6px;font-weight:normal">Ключевые решения</h4><ul>${end.keys.map(k=>`<li>${escapeHtml(k)}</li>`).join('')}</ul></div>`:'';
  return`<div class="screen end-wrap"><div class="panel">
    <h1 class="end-title">${escapeHtml(end.title)}</h1>
    <div class="end-subtitle">${escapeHtml(end.subtitle)}</div>
    <div class="end-tags">${end.tags.map(t=>`<span class="end-tag">${t}</span>`).join('')}</div>
    <div class="end-text">${end.paragraphs.map(t=>`<p>${t}</p>`).join('')}</div>
    ${keysHtml}
    <div class="end-stats"><h4>Статистика</h4>${stats.map(st=>`<div class="stat-row"><span>${st.l}</span><span>${st.v}</span></div>`).join('')}</div>
    <button class="btn primary" id="btn-restart">Сначала</button>
  </div></div>`;
}
function bindEnd(){$('btn-restart').onclick=()=>{state=newGameState();state.screen='title';render();};}

state=newGameState();
render();
</script>
</body>
</html>
